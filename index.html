```
<script type="module">
    import React, { useState, useEffect } from 'https://esm.sh/react@18';
    import ReactDOM from 'https://esm.sh/react-dom@18/client';

    const tg = window.Telegram?.WebApp;
    const isTelegram = !!tg;
    
    if (isTelegram) {
        tg.ready();
        tg.expand();
        tg.enableClosingConfirmation();
    }

    function DebtTracker() {
      const [debts, setDebts] = useState([]);
      const [showForm, setShowForm] = useState(false);
      const [darkMode, setDarkMode] = useState(isTelegram ? tg.colorScheme === 'dark' : false);
      const [activeStrategy, setActiveStrategy] = useState('snowball');
      const [monthlyBudget, setMonthlyBudget] = useState('');
      const [paymentHistory, setPaymentHistory] = useState([]);
      const [loading, setLoading] = useState(true);
      const [newDebt, setNewDebt] = useState({
        name: '',
        amount: '',
        interestRate: '',
        minPayment: '',
        dueDate: ''
      });

      useEffect(() => {
        if (isTelegram && tg.CloudStorage) {
          tg.CloudStorage.getItems(['debts', 'paymentHistory', 'monthlyBudget', 'activeStrategy'], (error, result) => {
            if (!error && result) {
              if (result.debts) setDebts(JSON.parse(result.debts));
              if (result.paymentHistory) setPaymentHistory(JSON.parse(result.paymentHistory));
              if (result.monthlyBudget) setMonthlyBudget(result.monthlyBudget);
              if (result.activeStrategy) setActiveStrategy(result.activeStrategy);
            }
            setLoading(false);
          });
        } else {
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        if (loading) return;

        if (isTelegram && tg.CloudStorage) {
          tg.CloudStorage.setItem('debts', JSON.stringify(debts));
          tg.CloudStorage.setItem('paymentHistory', JSON.stringify(paymentHistory));
          tg.CloudStorage.setItem('monthlyBudget', monthlyBudget);
          tg.CloudStorage.setItem('activeStrategy', activeStrategy);
        }
      }, [debts, paymentHistory, monthlyBudget, activeStrategy, loading]);

      useEffect(() => {
        if (isTelegram) {
          const isDark = tg.colorScheme === 'dark';
          setDarkMode(isDark);
          
          if (isDark) {
            document.documentElement.classList.add('dark');
            tg.setHeaderColor('#1f2937');
            tg.setBackgroundColor('#111827');
          } else {
            document.documentElement.classList.remove('dark');
            tg.setHeaderColor('#667eea');
            tg.setBackgroundColor('#f9fafb');
          }
        } else {
          if (darkMode) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        }
      }, [darkMode]);

      const haptic = (type = 'medium') => {
        if (isTelegram && tg.HapticFeedback) {
          if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
          else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
          else tg.HapticFeedback.impactOccurred(type);
        }
      };

      const showAlert = (msg) => {
        if (isTelegram) tg.showAlert(msg);
        else alert(msg);
      };

      const showConfirm = (msg, cb) => {
        if (isTelegram) tg.showConfirm(msg, cb);
        else cb(confirm(msg));
      };

      const addDebt = () => {
        if (newDebt.name && newDebt.amount) {
          haptic('success');
          setDebts([...debts, {
            id: Date.now(),
            ...newDebt,
            amount: parseFloat(newDebt.amount),
            interestRate: parseFloat(newDebt.interestRate) || 0,
            minPayment: parseFloat(newDebt.minPayment) || 0,
            paid: 0,
            createdAt: new Date().toISOString()
          }]);
          setNewDebt({ name: '', amount: '', interestRate: '', minPayment: '', dueDate: '' });
          setShowForm(false);
          showAlert('✅ Долг добавлен!');
        } else {
          haptic('error');
          showAlert('❌ Заполните название и сумму');
        }
      };

      const deleteDebt = (id) => {
        showConfirm('Удалить долг?', (ok) => {
          if (ok) {
            haptic('medium');
            setDebts(debts.filter(d => d.id !== id));
          }
        });
      };

      const updatePayment = (id, payment) => {
        const amt = parseFloat(payment);
        const debt = debts.find(d => d.id === id);
        
        if (amt <= 0) {
          haptic('error');
          showAlert('❌ Введите сумму');
          return;
        }

        haptic('success');
        
        setDebts(debts.map(d => 
          d.id === id ? { ...d, paid: Math.min(d.paid + amt, d.amount) } : d
        ));
        
        setPaymentHistory([...paymentHistory, {
          id: Date.now(),
          debtName: debt.name,
          amount: amt,
          date: new Date().toISOString()
        }]);

        if (debt.paid + amt >= debt.amount) {
          showAlert('🎉 Долг погашен!');
        } else {
          showAlert('✅ Платеж зафиксирован!');
        }
      };

      const shareResults = () => {
        const msg = `📊 Прогресс:\n💰 ${totalDebt.toLocaleString('ru-RU')} ₽\n✅ ${totalPaid.toLocaleString('ru-RU')} ₽\n🎯 ${remaining.toLocaleString('ru-RU')} ₽`;
        if (isTelegram) {
          haptic('medium');
          tg.switchInlineQuery(msg, ['users', 'groups']);
        }
      };

      const totalDebt = debts.reduce((s, d) => s + d.amount, 0);
      const totalPaid = debts.reduce((s, d) => s + d.paid, 0);
      const remaining = totalDebt - totalPaid;

      const strategies = {
        snowball: {
          name: '❄️ Снежный ком',
          desc: 'Маленькие долги',
          debts: [...debts].filter(d => d.paid < d.amount).sort((a, b) => (a.amount - a.paid) - (b.amount - b.paid)),
          color: 'from-blue-500 to-cyan-500'
        },
        avalanche: {
          name: '🔥 Лавина',
          desc: 'Высокие %',
          debts: [...debts].filter(d => d.paid < d.amount).sort((a, b) => b.interestRate - a.interestRate),
          color: 'from-orange-500 to-red-500'
        },
        highest: {
          name: '💪 Большой',
          desc: 'Крупные долги',
          debts: [...debts].filter(d => d.paid < d.amount).sort((a, b) => (b.amount - b.paid) - (a.amount - a.paid)),
          color: 'from-purple-500 to-pink-500'
        },
        balanced: {
          name: '⚖️ Баланс',
          desc: 'Оптимально',
          debts: [...debts].filter(d => d.paid < d.amount).sort((a, b) => {
            const sA = (a.interestRate * 0.5) + ((a.amount - a.paid) / 1000 * 0.3);
            const sB = (b.interestRate * 0.5) + ((b.amount - b.paid) / 1000 * 0.3);
            return sB - sA;
          }),
          color: 'from-green-500 to-emerald-500'
        }
      };

      const stats = {
        total: debts.length,
        active: debts.filter(d => d.paid < d.amount).length,
        done: debts.filter(d => d.paid >= d.amount).length,
        avgRate: debts.length > 0 ? (debts.reduce((s, d) => s + d.interestRate, 0) / debts.length).toFixed(1) : 0,
        paid: paymentHistory.reduce((s, p) => s + p.amount, 0)
      };

      const payoffMonths = monthlyBudget && remaining > 0 ? Math.ceil(remaining / parseFloat(monthlyBudget)) : null;

      if (loading) {
        return React.createElement('div', { 
          className: `min-h-screen flex items-center justify-center ${darkMode ? 'bg-gray-900' : 'bg-gray-50'}`
        },
          React.createElement('div', { className: "text-center" },
            React.createElement('div', { className: "text-6xl mb-4 animate-bounce" }, '💳'),
            React.createElement('div', { className: `text-xl ${darkMode ? 'text-white' : 'text-gray-800'}` }, 'Загрузка...')
          )
        );
      }

      return React.createElement('div', { 
        className: `min-h-screen ${darkMode ? 'bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900' : 'bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50'} p-4 pb-20` 
      },
        React.createElement('div', { className: "max-w-4xl mx-auto" },
          
          React.createElement('div', { className: "flex justify-between items-center mb-4" },
            React.createElement('div', null,
              React.createElement('h1', { className: `text-2xl font-bold ${darkMode ? 'text-white' : 'text-gray-800'}` }, '💳 Учет Долгов'),
              React.createElement('p', { className: `text-xs ${darkMode ? 'text-gray-300' : 'text-gray-600'}` }, 
                isTelegram ? `Привет, ${tg.initDataUnsafe?.user?.first_name || 'друг'}!` : 'Управляйте долгами'
              )
            ),
            React.createElement('div', { className: "flex gap-2" },
              !isTelegram && React.createElement('button', {
                onClick: () => {haptic('light'); setDarkMode(!darkMode);},
                className: `p-2 rounded-lg ${darkMode ? 'bg-yellow-400 text-gray-900' : 'bg-gray-800 text-white'}`
              }, darkMode ? '☀️' : '🌙'),
              isTelegram && debts.length > 0 && React.createElement('button', {
                onClick: shareResults,
                className: "p-2 rounded-lg bg-blue-500 text-white"
              }, '📤')
            )
          ),

          React.createElement('div', { className: "grid grid-cols-3 gap-2 mb-4" },
            [
              { l: 'Всего', v: stats.total, i: '📊' },
              { l: 'Активно', v: stats.active, i: '⚡' },
              { l: 'Готово', v: stats.done, i: '✅' }
            ].map((s, i) =>
              React.createElement('div', { 
                key: i,
                className: `glass-effect rounded-lg p-2 ${darkMode ? 'text-white' : 'text-gray-800'}`
              },
                React.createElement('div', { className: "text-xl" }, s.i),
                React.createElement('div', { className: "text-lg font-bold" }, s.v),
                React.createElement('div', { className: `text-xs ${darkMode ? 'text-gray-300' : 'text-gray-600'}` }, s.l)
              )
            )
          ),

          React.createElement('div', { className: "grid grid-cols-3 gap-2 mb-4" },
            [
              { l: 'Долг', v: totalDebt, i: '💰', c: 'from-red-500 to-pink-500' },
              { l: 'Выплачено', v: totalPaid, i: '✅', c: 'from-green-500 to-emerald-500' },
              { l: 'Осталось', v: remaining, i: '🎯', c: 'from-orange-500 to-yellow-500' }
            ].map((card, i) =>
              React.createElement('div', { 
                key: i,
                className: `bg-gradient-to-r ${card.c} rounded-lg p-3 shadow-lg`
              },
                React.createElement('div', { className: "text-white text-xs opacity-90" }, card.l),
                React.createElement('div', { className: "text-white text-lg font-bold" },
                  (card.v / 1000).toFixed(0) + 'k'
                )
              )
            )
          ),

          React.createElement('button', {
            onClick: () => {haptic('medium'); setShowForm(!showForm);},
            className: `w-full mb-3 bg-gradient-to-r from-purple-500 to-pink-500 text-white px-4 py-3 rounded-lg font-semibold ${showForm ? 'pulse-glow' : ''}`
          }, showForm ? '❌ Отменить' : '➕ Добавить долг'),

          showForm && React.createElement('div', { className: `${darkMode ? 'bg-gray-800' : 'bg-white'} p-3 rounded-lg mb-3 shadow-lg` },
            React.createElement('input', {
              type: "text",
              placeholder: "Название",
              value: newDebt.name,
              onChange: (e) => setNewDebt({...newDebt, name: e.target.value}),
              className: `w-full p-2 mb-2 border-2 ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'border-purple-200'} rounded-lg text-sm`
            }),
            React.createElement('div', { className: "grid grid-cols-2 gap-2" },
              React.createElement('input', {
                type: "number",
                placeholder: "Сумма",
                value: newDebt.amount,
                onChange: (e) => setNewDebt({...newDebt, amount: e.target.value}),
                className: `p-2 border-2 ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'border-purple-200'} rounded-lg text-sm`
              }),
              React.createElement('input', {
                type: "number",
                placeholder: "%",
                value: newDebt.interestRate,
                onChange: (e) => setNewDebt({...newDebt, interestRate: e.target.value}),
                className: `p-2 border-2 ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'border-purple-200'} rounded-lg text-sm`
              })
            ),
            React.createElement('button', {
              onClick: addDebt,
              className: "w-full bg-purple-600 text-white py-2 rounded-lg mt-2 font-semibold text-sm"
            }, '💾 Сохранить')
          ),

          React.createElement('div', { className: "space-y-2 mb-4" },
            debts.map((d) => {
              const prog = (d.paid / d.amount) * 100;
              const left = d.amount - d.paid;
              const done = d.paid >= d.amount;
              
              return React.createElement('div', { 
                key: d.id, 
                className: `${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-lg p-3 shadow-lg ${done ? 'opacity-60' : ''}`
              },
                React.createElement('div', { className: "flex justify-between mb-2" },
                  React.createElement('div', { className: "flex-1" },
                    React.createElement('h3', { className: `font-bold text-sm ${darkMode ? 'text-white' : 'text-gray-800'} ${done ? 'line-through' : ''}` }, 
                      d.name + (done ? ' ✅' : '')
                    ),
                    d.interestRate > 0 && React.createElement('span', { className: "text-xs bg-red-100 text-red-700 px-2 rounded-full" }, d.interestRate + '%')
                  ),
                  React.createElement('button', {
                    onClick: () => deleteDebt(d.id),
                    className: "text-red-500 p-1"
                  }, '🗑️')
                ),
                React.createElement('div', { className: "mb-2" },
                  React.createElement('div', { className: `flex justify-between text-xs mb-1 ${darkMode ? 'text-gray-300' : 'text-gray-600'}` },
                    React.createElement('span', null, '✅ ' + (d.paid / 1000).toFixed(0) + 'k'),
                    React.createElement('span', null, '⏳ ' + (left / 1000).toFixed(0) + 'k')
                  ),
                  React.createElement('div', { className: `w-full ${darkMode ? 'bg-gray-700' : 'bg-gray-200'} rounded-full h-2` },
                    React.createElement('div', {
                      className: "bg-gradient-to-r from-green-400 to-emerald-500 h-2 rounded-full",
                      style: { width: prog + '%' }
                    })
                  )
                ),
                !done && React.createElement('div', { className: "flex gap-2" },
                  React.createElement('input', {
                    type: "number",
                    placeholder: "Сумма",
                    id: 'pay-' + d.id,
                    className: `flex-1 p-2 text-sm border-2 ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'border-gray-200'} rounded-lg`,
                    onKeyPress: (e) => {
                      if (e.key === 'Enter' && e.target.value) {
                        updatePayment(d.id, e.target.value);
                        e.target.value = '';
                      }
                    }
                  }),
                  React.createElement('button', {
                    onClick: () => {
                      const inp = document.getElementById('pay-' + d.id);
                      if (inp.value) {
                        updatePayment(d.id, inp.value);
                        inp.value = '';
                      }
                    },
                    className: "bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-semibold"
                  }, '💳')
                )
              );
            }),

            debts.length === 0 && React.createElement('div', { className: `${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-lg p-8 text-center shadow-lg` },
              React.createElement('p', { className: "text-5xl mb-2" }, '💳'),
              React.createElement('p', { className: `text-sm ${darkMode ? 'text-white' : 'text-gray-800'}` }, 'Нет долгов')
            )
          ),

          debts.filter(d => d.paid < d.amount).length > 0 && React.createElement('div', { className: `${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-lg p-3 shadow-lg mb-4` },
            React.createElement('h2', { className: `text-sm font-bold ${darkMode ? 'text-white' : 'text-gray-800'} mb-2` }, '🎯 Стратегии'),
            React.createElement('div', { className: "grid grid-cols-2 gap-2" },
              Object.entries(strategies).map(([k, s]) =>
                React.createElement('button', { 
                  key: k,
                  onClick: () => {haptic('light'); setActiveStrategy(k);},
                  className: `text-left ${
                    activeStrategy === k 
                      ? `bg-gradient-to-r ${s.color} text-white` 
                      : `${darkMode ? 'bg-gray-700 text-white' : 'bg-gray-100'}`
                  } p-2 rounded-lg text-xs`
                },
                  React.createElement('div', { className: "font-bold" }, s.name),
                  React.createElement('div', { className: "text-xs opacity-80" }, s.desc)
                )
              )
            )
          ),

          React.createElement('div', { className: `${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-lg p-3 shadow-lg mb-4` },
            React.createElement('h2', { className: `text-sm font-bold ${darkMode ? 'text-white' : 'text-gray-800'} mb-2` }, '📊 Калькулятор'),
            React.createElement('input', {
              type: "number",
              placeholder: "Месячный бюджет (₽)",
              value: monthlyBudget,
              onChange: (e) => setMonthlyBudget(e.target.value),
              className: `w-full p-2 border-2 ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'border-purple-200'} rounded-lg text-sm`
            }),
            payoffMonths && React.createElement('div', { className: `mt-2 ${darkMode ? 'bg-purple-900' : 'bg-purple-100'} p-2 rounded-lg` },
              React.createElement('div', { className: `text-xs ${darkMode ? 'text-gray-300' : 'text-gray-600'}` }, 'Срок:'),
              React.createElement('div', { className: `text-xl font-bold ${darkMode ? 'text-white' : 'text-purple-700'}` }, payoffMonths + ' мес.')
            )
          ),

          React.createElement('div', { className: "bg-gradient-to-br from-green-500 to-emerald-600 rounded-lg p-3 text-white mb-4" },
            React.createElement('h3', { className: "font-bold text-sm mb-2" }, '💡 Советы'),
            React.createElement('ul', { className: "space-y-1 text-xs" },
              ['Платите больше минимума', 'Избегайте новых долгов', 'Отслеживайте прогресс'].map((t, i) =>
                React.createElement('li', { key: i }, '✓ ' + t)
              )
            )
          ),

          isTelegram && React.createElement('div', { className: `${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-lg p-3 text-center shadow-lg` },
            React.createElement('div', { className: "text-xl mb-1" }, '🤖'),
            React.createElement('div', { className: `text-xs ${darkMode ? 'text-gray-300' : 'text-gray-600'}` }, 'Данные в облаке Telegram')
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(DebtTracker));
</script>
