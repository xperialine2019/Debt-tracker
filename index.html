<script type="module">
    import React, { useState, useEffect } from 'https://esm.sh/react@18';
    import ReactDOM from 'https://esm.sh/react-dom@18/client';

    function DebtTracker() {
      const [debts, setDebts] = useState([]);
      const [showForm, setShowForm] = useState(false);
      const [darkMode, setDarkMode] = useState(false);
      const [activeStrategy, setActiveStrategy] = useState('snowball');
      const [monthlyBudget, setMonthlyBudget] = useState('');
      const [paymentHistory, setPaymentHistory] = useState([]);
      const [newDebt, setNewDebt] = useState({
        name: '',
        amount: '',
        interestRate: '',
        minPayment: '',
        dueDate: ''
      });

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      const addDebt = () => {
        if (newDebt.name && newDebt.amount) {
          setDebts([...debts, {
            id: Date.now(),
            ...newDebt,
            amount: parseFloat(newDebt.amount),
            interestRate: parseFloat(newDebt.interestRate) || 0,
            minPayment: parseFloat(newDebt.minPayment) || 0,
            paid: 0,
            createdAt: new Date().toISOString()
          }]);
          setNewDebt({ name: '', amount: '', interestRate: '', minPayment: '', dueDate: '' });
          setShowForm(false);
        }
      };

      const deleteDebt = (id) => {
        setDebts(debts.filter(d => d.id !== id));
      };

      const updatePayment = (id, payment) => {
        const paymentAmount = parseFloat(payment);
        const debt = debts.find(d => d.id === id);
        
        setDebts(debts.map(d => 
          d.id === id ? { ...d, paid: Math.min(d.paid + paymentAmount, d.amount) } : d
        ));
        
        setPaymentHistory([
          ...paymentHistory,
          {
            id: Date.now(),
            debtName: debt.name,
            amount: paymentAmount,
            date: new Date().toISOString()
          }
        ]);
      };

      const totalDebt = debts.reduce((sum, d) => sum + d.amount, 0);
      const totalPaid = debts.reduce((sum, d) => sum + d.paid, 0);
      const remaining = totalDebt - totalPaid;
      const totalInterest = debts.reduce((sum, d) => sum + (d.amount * d.interestRate / 100), 0);

      const getPayoffStrategies = () => {
        const sortedDebts = [...debts].filter(d => d.paid < d.amount);
        
        return {
          snowball: {
            name: '❄️ Снежный ком',
            description: 'Самые маленькие долги первыми',
            debts: [...sortedDebts].sort((a, b) => (a.amount - a.paid) - (b.amount - b.paid)),
            color: 'from-blue-500 to-cyan-500'
          },
          avalanche: {
            name: '🔥 Лавина',
            description: 'Высокие проценты первыми',
            debts: [...sortedDebts].sort((a, b) => b.interestRate - a.interestRate),
            color: 'from-orange-500 to-red-500'
          },
          highestFirst: {
            name: '💪 Самый большой',
            description: 'Крупные долги первыми',
            debts: [...sortedDebts].sort((a, b) => (b.amount - b.paid) - (a.amount - a.paid)),
            color: 'from-purple-500 to-pink-500'
          },
          balanced: {
            name: '⚖️ Сбалансированный',
            description: 'Оптимальное сочетание',
            debts: [...sortedDebts].sort((a, b) => {
              const scoreA = (a.interestRate * 0.5) + ((a.amount - a.paid) / 1000 * 0.3) + (a.minPayment * 0.2);
              const scoreB = (b.interestRate * 0.5) + ((b.amount - b.paid) / 1000 * 0.3) + (b.minPayment * 0.2);
              return scoreB - scoreA;
            }),
            color: 'from-green-500 to-emerald-500'
          },
          deadline: {
            name: '⏰ По срокам',
            description: 'Ближайшие сроки первыми',
            debts: [...sortedDebts].sort((a, b) => {
              if (!a.dueDate) return 1;
              if (!b.dueDate) return -1;
              return new Date(a.dueDate) - new Date(b.dueDate);
            }),
            color: 'from-yellow-500 to-orange-500'
          }
        };
      };

      const strategies = getPayoffStrategies();

      const calculatePayoffTime = () => {
        if (!monthlyBudget || remaining === 0) return null;
        const budget = parseFloat(monthlyBudget);
        const monthlyInterest = totalInterest / 12;
        const effectivePayment = budget - monthlyInterest;
        
        if (effectivePayment <= 0) return { months: 999, message: 'Бюджет слишком мал' };
        
        const months = Math.ceil(remaining / effectivePayment);
        return { months, message: `${months} месяцев` };
      };

      const payoffTime = calculatePayoffTime();

      const stats = {
        totalDebts: debts.length,
        activeDebts: debts.filter(d => d.paid < d.amount).length,
        paidOffDebts: debts.filter(d => d.paid >= d.amount).length,
        avgInterest: debts.length > 0 ? (debts.reduce((sum, d) => sum + d.interestRate, 0) / debts.length).toFixed(1) : 0,
        totalPayments: paymentHistory.reduce((sum, p) => sum + p.amount, 0)
      };

      return React.createElement('div', { 
        className: `min-h-screen transition-all duration-500 ${darkMode ? 'bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900' : 'bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50'} p-4 md:p-6` 
      },
        React.createElement('div', { className: "max-w-7xl mx-auto" },
          // Header with Theme Toggle
          React.createElement('div', { className: "flex justify-between items-center mb-8 animate-slide-in" },
            React.createElement('div', { className: "text-center flex-1" },
              React.createElement('h1', { className: `text-4xl md:text-5xl font-bold mb-2 ${darkMode ? 'text-white' : 'text-gray-800'}` }, 
                '💳 Учет Долгов'
              ),
              React.createElement('p', { className: `${darkMode ? 'text-gray-300' : 'text-gray-600'}` }, 
                'Управляйте долгами и планируйте выход из них'
              )
            ),
            React.createElement('button', {
              onClick: () => setDarkMode(!darkMode),
              className: `p-3 rounded-xl ${darkMode ? 'bg-yellow-400 text-gray-900' : 'bg-gray-800 text-white'} hover:scale-110 transition-transform`
            }, darkMode ? '☀️' : '🌙')
          ),

          // Stats Dashboard
          React.createElement('div', { className: "grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4 mb-8" },
            [
              { label: 'Всего долгов', value: stats.totalDebts, icon: '📊', color: 'blue' },
              { label: 'Активных', value: stats.activeDebts, icon: '⚡', color: 'yellow' },
              { label: 'Погашено', value: stats.paidOffDebts, icon: '✅', color: 'green' },
              { label: 'Средний %', value: stats.avgInterest + '%', icon: '📈', color: 'red' },
              { label: 'Выплачено', value: stats.totalPayments.toLocaleString('ru-RU') + ' ₽', icon: '💰', color: 'purple' }
            ].map((stat, i) =>
              React.createElement('div', { 
                key: i,
                className: `glass-effect rounded-2xl p-4 animate-slide-in ${darkMode ? 'text-white' : 'text-gray-800'}`,
                style: { animationDelay: `${i * 0.1}s` }
              },
                React.createElement('div', { className: "text-2xl mb-2" }, stat.icon),
                React.createElement('div', { className: "text-xl md:text-2xl font-bold" }, stat.value),
                React.createElement('div', { className: `text-xs ${darkMode ? 'text-gray-300' : 'text-gray-600'}` }, stat.label)
              )
            )
          ),

          // Main Summary Cards
          React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-3 gap-4 mb-8" },
            [
              { label: 'Общий долг', value: totalDebt, icon: '💰', gradient: 'from-red-500 to-pink-500' },
              { label: 'Выплачено', value: totalPaid, icon: '✅', gradient: 'from-green-500 to-emerald-500' },
              { label: 'Осталось', value: remaining, icon: '🎯', gradient: 'from-orange-500 to-yellow-500' }
            ].map((card, i) =>
              React.createElement('div', { 
                key: i,
                className: `bg-gradient-to-r ${card.gradient} rounded-2xl p-6 shadow-2xl transform hover:scale-105 transition-all animate-slide-in`,
                style: { animationDelay: `${i * 0.15}s` }
              },
                React.createElement('div', { className: "flex items-center justify-between mb-2" },
                  React.createElement('span', { className: "text-white text-sm font-medium opacity-90" }, card.label),
                  React.createElement('span', { className: "text-3xl" }, card.icon)
                ),
                React.createElement('div', { className: "text-3xl md:text-4xl font-bold text-white" },
                  card.value.toLocaleString('ru-RU') + ' ₽'
                )
              )
            )
          ),

          React.createElement('div', { className: "grid grid-cols-1 lg:grid-cols-3 gap-6" },
            // Left Column - Debts List
            React.createElement('div', { className: "lg:col-span-2 space-y-6" },
              // Debts Section
              React.createElement('div', { className: `${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-2xl shadow-2xl p-6` },
                React.createElement('div', { className: "flex justify-between items-center mb-6" },
                  React.createElement('h2', { className: `text-2xl font-bold ${darkMode ? 'text-white' : 'text-gray-800'}` }, 
                    '📋 Мои Долги'
                  ),
                  React.createElement('button', {
                    onClick: () => setShowForm(!showForm),
                    className: "bg-gradient-to-r from-purple-500 to-pink-500 text-white px-4 py-2 rounded-xl flex items-center gap-2 hover:shadow-lg transform hover:scale-105 transition-all pulse-glow"
                  }, '➕ Добавить')
                ),

                showForm && React.createElement('div', { className: `${darkMode ? 'bg-gray-700' : 'bg-gradient-to-r from-purple-50 to-pink-50'} p-6 rounded-xl mb-6 border-2 ${darkMode ? 'border-purple-500' : 'border-purple-200'} animate-slide-in` },
                  React.createElement('input', {
                    type: "text",
                    placeholder: "Название (например, Кредит в банке)",
                    value: newDebt.name,
                    onChange: (e) => setNewDebt({...newDebt, name: e.target.value}),
                    className: `w-full p-3 mb-3 border-2 ${darkMode ? 'bg-gray-600 border-gray-500 text-white' : 'border-purple-200'} rounded-lg focus:outline-none focus:border-purple-400`
                  }),
                  React.createElement('div', { className: "grid grid-cols-2 gap-3" },
                    React.createElement('input', {
                      type: "number",
                      placeholder: "Сумма долга (₽)",
                      value: newDebt.amount,
                      onChange: (e) => setNewDebt({...newDebt, amount: e.target.value}),
                      className: `p-3 border-2 ${darkMode ? 'bg-gray-600 border-gray-500 text-white' : 'border-purple-200'} rounded-lg focus:outline-none focus:border-purple-400`
                    }),
                    React.createElement('input', {
                      type: "number",
                      placeholder: "Процент (%)",
                      value: newDebt.interestRate,
                      onChange: (e) => setNewDebt({...newDebt, interestRate: e.target.value}),
                      className: `p-3 border-2 ${darkMode ? 'bg-gray-600 border-gray-500 text-white' : 'border-purple-200'} rounded-lg focus:outline-none focus:border-purple-400`
                    }),
                    React.createElement('input', {
                      type: "number",
                      placeholder: "Мин. платеж (₽)",
                      value: newDebt.minPayment,
                      onChange: (e) => setNewDebt({...newDebt, minPayment: e.target.value}),
                      className: `p-3 border-2 ${darkMode ? 'bg-gray-600 border-gray-500 text-white' : 'border-purple-200'} rounded-lg focus:outline-none focus:border-purple-400`
                    }),
                    React.createElement('input', {
                      type: "date",
                      value: newDebt.dueDate,
                      onChange: (e) => setNewDebt({...newDebt, dueDate: e.target.value}),
                      className: `p-3 border-2 ${darkMode ? 'bg-gray-600 border-gray-500 text-white' : 'border-purple-200'} rounded-lg focus:outline-none focus:border-purple-400`
                    })
                  ),
                  React.createElement('button', {
                    onClick: addDebt,
                    className: "w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 rounded-lg mt-3 font-semibold hover:shadow-lg transform hover:scale-105 transition-all"
                  }, '💾 Сохранить')
                ),

                React.createElement('div', { className: "space-y-4" },
                  debts.map(debt => {
                    const progress = (debt.paid / debt.amount) * 100;
                    const remaining = debt.amount - debt.paid;
                    const isCompleted = debt.paid >= debt.amount;
                    
                    return React.createElement('div', { 
                      key: debt.id, 
                      className: `border-2 ${darkMode ? 'border-gray-600 bg-gray-700' : 'border-gray-100 bg-gradient-to-r from-white to-gray-50'} rounded-xl p-5 hover:shadow-2xl transition-all transform hover:scale-102 ${isCompleted ? 'opacity-60' : ''}`
                    },
                      React.createElement('div', { className: "flex justify-between items-start mb-3" },
                        React.createElement('div', null,
                          React.createElement('h3', { className: `font-bold text-lg ${darkMode ? 'text-white' : 'text-gray-800'} ${isCompleted ? 'line-through' : ''}` }, 
                            debt.name,
                            isCompleted && ' ✅'
                          ),
                          React.createElement('div', { className: "flex flex-wrap gap-2 text-sm mt-2" },
                            debt.interestRate > 0 && React.createElement('span', { className: "bg-red-100 text-red-700 px-3 py-1 rounded-full font-medium" },
                              '📊 ' + debt.interestRate + '% годовых'
                            ),
                            debt.minPayment > 0 && React.createElement('span', { className: "bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-medium" },
                              '💵 Мин: ' + debt.minPayment + ' ₽'
                            ),
                            debt.dueDate && React.createElement('span', { className: "bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full font-medium" },
                              '📅 ' + new Date(debt.dueDate).toLocaleDateString('ru-RU')
                            )
                          )
                        ),
                        React.createElement('button', {
                          onClick: () => deleteDebt(debt.id),
                          className: "text-red-500 hover:bg-red-50 p-2 rounded-lg transition-all transform hover:scale-110"
                        }, '🗑️')
                      ),

                      React.createElement('div', { className: "mb-3" },
                        React.createElement('div', { className: `flex justify-between text-sm mb-2 ${darkMode ? 'text-gray-300' : ''}` },
                          React.createElement('span', null, '✅ Выплачено: ' + debt.paid.toLocaleString('ru-RU') + ' ₽'),
                          React.createElement('span', { className: "font-semibold" }, '⏳ Осталось: ' + remaining.toLocaleString('ru-RU') + ' ₽')
                        ),
                        React.createElement('div', { className: `w-full ${darkMode ? 'bg-gray-600' : 'bg-gray-200'} rounded-full h-4 overflow-hidden shadow-inner` },
                          React.createElement('div', {
                            className: "bg-gradient-to-r from-green-400 via-emerald-500 to-green-600 h-4 rounded-full transition-all duration-500 relative",
                            style: { width: progress + '%' }
                          },
                            React.createElement('div', { className: "absolute inset-0 bg-white opacity-20 animate-pulse" })
                          )
                        ),
                        React.createElement('div', { className: `text-right text-xs ${darkMode ? 'text-gray-400' : 'text-gray-500'} mt-1 font-semibold` }, 
                          progress.toFixed(1) + '%'
                        )
                      ),

                      !isCompleted && React.createElement('div', { className: "flex gap-2" },
                        React.createElement('input', {
                          type: "number",
                          placeholder: "Сумма платежа",
                          id: 'payment-' + debt.id,
                          className: `flex-1 p-3 border-2 ${darkMode ? 'bg-gray-600 border-gray-500 text-white' : 'border-gray-200'} rounded-lg focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-200`,
                          onKeyPress: (e) => {
                            if (e.key === 'Enter' && e.target.value) {
                              updatePayment(debt.id, e.target.value);
                              e.target.value = '';
                            }
                          }
                        }),
                        React.createElement('button', {
                          onClick: (e) => {
                            const input = document.getElementById('payment-' + debt.id);
                            if (input.value) {
                              updatePayment(debt.id, input.value);
                              input.value = '';
                            }
                          },
                          className: "bg-gradient-to-r from-green-500 to-emerald-500 text-white px-6 py-3 rounded-lg hover:shadow-lg transform hover:scale-105 transition-all font-semibold"
                        }, '💳 Оплатить')
                      )
                    );
                  }),

                  debts.length === 0 && React.createElement('div', { className: `text-center py-16 ${darkMode ? 'text-gray-400' : 'text-gray-400'}` },
                    React.createElement('p', { className: "text-6xl mb-4 animate-bounce" }, '💳'),
                    React.createElement('p', { className: "text-xl font-semibold mb-2" }, 'Нет добавленных долгов'),
                    React.createElement('p', { className: "text-sm" }, 'Начните с добавления первого долга')
                  )
                )
              ),

              // Payment History
              paymentHistory.length > 0 && React.createElement('div', { className: `${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-2xl shadow-2xl p-6` },
                React.createElement('h2', { className: `text-2xl font-bold ${darkMode ? 'text-white' : 'text-gray-800'} mb-4` }, 
                  '📜 История платежей'
                ),
                React.createElement('div', { className: "space-y-2 max-h-96 overflow-y-auto" },
                  [...paymentHistory].reverse().slice(0, 10).map(payment =>
                    React.createElement('div', { 
                      key: payment.id,
                      className: `${darkMode ? 'bg-gray-700' : 'bg-gray-50'} p-3 rounded-lg flex justify-between items-center`
                    },
                      React.createElement('div', null,
                        React.createElement('div', { className: `font-semibold ${darkMode ? 'text-white' : 'text-gray-800'}` }, payment.debtName),
                        React.createElement('div', { className: `text-xs ${darkMode ? 'text-gray-400' : 'text-gray-500'}` }, 
                          new Date(payment.date).toLocaleString('ru-RU')
                        )
                      ),
                      React.createElement('div', { className: "text-green-600 font-bold" }, 
                        '+' + payment.amount.toLocaleString('ru-RU') + ' ₽'
                      )
                    )
                  )
                )
              )
            ),

            // Right Column - Strategies & Tools
            React.createElement('div', { className: "lg:col-span-1 space-y-6" },
              // Monthly Budget Calculator
              React.createElement('div', { className: `${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-2xl shadow-2xl p-6` },
                React.createElement('h2', { className: `text-xl font-bold ${darkMode ? 'text-white' : 'text-gray-800'} mb-4` }, 
                  '📊 Калькулятор'
                ),
                React.createElement('input', {
                  type: "number",
                  placeholder: "Месячный бюджет на долги (₽)",
                  value: monthlyBudget,
                  onChange: (e) => setMonthlyBudget(e.target.value),
                  className: `w-full p-3 border-2 ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'border-purple-200'} rounded-lg focus:outline-none focus:border-purple-400 mb-4`
                }),
                payoffTime && React.createElement('div', { className: `bg-gradient-to-r from-purple-100 to-pink-100 ${darkMode ? 'from-purple-900 to-pink-900' : ''} p-4 rounded-lg` },
                  React.createElement('div', { className: `text-sm ${darkMode ? 'text-gray-300' : 'text-gray-600'} mb-1` }, 'Срок погашения:'),
                  React.createElement('div', { className: `text-2xl font-bold ${darkMode ? 'text-white' : 'text-purple-700'}` }, 
                    payoffTime.message
                  ),
                  React.createElement('div', { className: `text-xs ${darkMode ? 'text-gray-400' : 'text-gray-500'} mt-2` }, 
                    'При текущей процентной нагрузке'
                  )
                )
              ),

              // Strategies
              React.createElement('div', { className: `${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-2xl shadow-2xl p-6` },
                React.createElement('h2', { className: `text-xl font-bold ${darkMode ? 'text-white' : 'text-gray-800'} mb-4` }, 
                  '🎯 Стратегии выплаты'
                ),

                React.createElement('div', { className: "space-y-3" },
                  Object.entries(strategies).map(([key, strategy]) =>
                    React.createElement('div', { 
                      key: key,
                      onClick: () => setActiveStrategy(key),
                      className: `cursor-pointer transition-all transform hover:scale-105 ${
                        activeStrategy === key 
                          ? `bg-gradient-to-r ${strategy.color} text-white shadow-2xl` 
                          : `${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-50 hover:bg-gray-100'}`
                      } p-4 rounded-xl border-2 ${
                        activeStrategy === key ? 'border-transparent' : darkMode ? 'border-gray-600' : 'border-gray-200'
                      }`
                    },
                      React.createElement('div', { className: "flex justify-between items-start mb-2" },
                        React.createElement('h3', { className: `font-bold ${activeStrategy === key ? 'text-white' : darkMode ? 'text-white' : 'text-gray-800'}` }, 
                          strategy.name
                        ),
                        activeStrategy === key && React.createElement('span', { className: "text-xl" }, '✓')
                      ),
                      React.createElement('p', { className: `text-sm mb-3 ${activeStrategy === key ? 'text-white opacity-90' : darkMode ? 'text-gray-400' : 'text-gray-600'}` }, 
                        strategy.description
                      ),
                      strategy.debts.length > 0 && React.createElement('ol', { className: "space-y-1 text-sm" },
                        strategy.debts.slice(0, 3).map((d, i) =>
                          React.createElement('li', { 
                            key: d.id, 
                            className: activeStrategy === key ? 'text-white' : darkMode ? 'text-gray-300' : 'text-gray-700'
                          },
                            (i + 1) + '. ' + d.name + ' (' + (d.amount - d.paid).toLocaleString('ru-RU') + ' ₽)'
                          )
                        )
                      )
                    )
                  )
                )
              ),

              // Tips
